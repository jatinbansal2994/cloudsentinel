# docker/docker-compose.yml
# ─────────────────────────
# Local development stack — mirrors AWS services without touching real AWS.
#
# Usage:
#   cd docker && docker compose up
#
# Services:
#   localstack  — emulates Kinesis, DynamoDB, S3, SNS locally (free)
#   redis       — ElastiCache replacement for local rate limiting
#   processor   — stream-processor Lambda running locally

version: '3.9'

services:
  localstack:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb,s3,kinesis,sns,sqs
      - DEFAULT_REGION=us-east-1
      - DEBUG=0
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  inference:
    build:
      context: ..
      dockerfile: docker/Dockerfile.inference
    ports:
      - "8080:8080"
    environment:
      - MODEL_DIR=model/

  stream-processor:
    build:
      context: ..
      dockerfile: docker/Dockerfile.lambda
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - TENANT_TABLE=cloudsentinel-tenants
      - ALERT_TABLE=cloudsentinel-alerts
      - DATA_BUCKET=cloudsentinel-datalake-local
      - SAGEMAKER_ENDPOINT=cloudsentinel-anomaly-detector
    depends_on:
      localstack:
        condition: service_healthy

volumes:
  localstack_data:

name: Deploy CloudSentinel

on:
  push:
    branches: [main]

# Prevent concurrent deploys — queue them instead of cancelling
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Job 1: deploy Lambda + API Gateway changes ─────────────────────────
  deploy-backend:
    name: Deploy Compute Stack (Lambda + API Gateway)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install AWS CDK
        run: npm install -g aws-cdk

      - name: Cache Python venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ hashFiles('requirements.txt') }}

      - name: Install CDK Python deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: CDK deploy Compute stack
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    us-east-1
        run: |
          source .venv/bin/activate
          cdk deploy CloudSentinel-Compute --require-approval never

  # ── Job 2: build React app and push to S3/CloudFront ───────────────────
  deploy-frontend:
    name: Build + Sync Frontend (S3 + CloudFront)
    runs-on: ubuntu-latest
    needs: deploy-backend   # wait for API changes to land first

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_ENDPOINT:        ${{ secrets.VITE_API_ENDPOINT }}
          VITE_USER_POOL_ID:        ${{ secrets.VITE_USER_POOL_ID }}
          VITE_USER_POOL_CLIENT_ID: ${{ secrets.VITE_USER_POOL_CLIENT_ID }}
        run: npm run build

      - name: Sync to S3
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    us-east-1
        run: |
          aws s3 sync frontend/dist s3://${{ secrets.S3_SITE_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    us-east-1
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CF_DIST_ID }} \
            --paths "/*"
